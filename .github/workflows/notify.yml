name: notify

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB: "https://uyut-site-default-rtdb.firebaseio.com/uyut"
    steps:
      - name: Check statuses and notify
        run: |
          set -e

          send_msg() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$1" > /dev/null
          }

          DATA=$(curl -s "$DB.json")
          META=$(echo "$DATA" | jq -c '._notifyMeta // {}')
          LAST_FLIP=$(echo "$META" | jq -r '.lastFlipDate // ""')
          TODAY=$(TZ='Europe/Moscow' date +%Y-%m-%d)
          DAY=$(TZ='Europe/Moscow' date +%d)

          if { [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; } && [ "$LAST_FLIP" != "$TODAY" ]; then
            PLANTS=$(echo "$DATA" | jq -c '.plants // []')
            NEW_PLANTS=$(echo "$PLANTS" | jq -c 'map(if .id=="succulent" then .status="red" else . end)')
            curl -s -X PUT -d "$NEW_PLANTS" "$DB/plants.json" > /dev/null
            send_msg "🌵 Суккулент пора полить! Статус сброшен на «Не полит»."
            LAST_FLIP="$TODAY"
          fi

          PRODUCTS=$(echo "$DATA" | jq -c '.products // []')
          PREV=$(echo "$META" | jq -c '.productStatuses // {}')

          echo "$PRODUCTS" | jq -c '.[]' | while read -r PROD; do
            ID=$(echo "$PROD" | jq -r '.id')
            NAME=$(echo "$PROD" | jq -r '.name')
            STATUS=$(echo "$PROD" | jq -r '.status')
            OLD=$(echo "$PREV" | jq -r --arg id "$ID" '.[$id] // ""')
            if [ -n "$OLD" ] && [ "$OLD" != "$STATUS" ]; then
              if [ "$STATUS" = "yellow" ]; then
                send_msg "🟡 «$NAME» кончается!"
              elif [ "$STATUS" = "green" ]; then
                send_msg "🟢 «$NAME» снова есть!"
              fi
            fi
          done

          NEW_PS=$(echo "$PRODUCTS" | jq -c 'map({(.id): .status}) | add // {}')
          NEW_META=$(jq -n --arg lf "$LAST_FLIP" --argjson ps "$NEW_PS" '{lastFlipDate:$lf, productStatuses:$ps}')
          curl -s -X PUT -d "$NEW_META" "$DB/_notifyMeta.json" > /dev/null
